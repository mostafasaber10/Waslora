name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;36.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run regression tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Build test APK
        shell: pwsh
        run: ./build.ps1

      - name: Save test APK
        if: startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Waslora-Android-test
          path: out/Waslora-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Waslora-Android-test
          path: out

      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Waslora ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/Waslora-debug.apk
