name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;36.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run regression tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Build test APK
        shell: pwsh
        run: ./build.ps1

      - name: Save test APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: Waslora-Android-test
          path: out/Waslora-debug.apk
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;36.0.0'

      - name: Restore private release key
        shell: pwsh
        env:
          RELEASE_KEY_BASE64: ${{ secrets.WASLORA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:RELEASE_KEY_BASE64) { throw 'Add WASLORA_RELEASE_KEYSTORE_BASE64 in repository Actions secrets before tagging a release.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'waslora-release.keystore'
          [System.IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:RELEASE_KEY_BASE64))
          "WASLORA_RELEASE_KEYSTORE=$keyPath" >> $env:GITHUB_ENV

      - name: Build release APK
        shell: pwsh
        env:
          WASLORA_RELEASE_ALIAS: ${{ secrets.WASLORA_RELEASE_ALIAS }}
          WASLORA_RELEASE_STORE_PASSWORD: ${{ secrets.WASLORA_RELEASE_STORE_PASSWORD }}
          WASLORA_RELEASE_KEY_PASSWORD: ${{ secrets.WASLORA_RELEASE_KEY_PASSWORD }}
        run: |
          if (-not $env:WASLORA_RELEASE_ALIAS -or -not $env:WASLORA_RELEASE_STORE_PASSWORD -or -not $env:WASLORA_RELEASE_KEY_PASSWORD) { throw 'Configure all Waslora release signing secrets before tagging a release.' }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./build.ps1 -Release -VersionName $version -VersionCode $env:GITHUB_RUN_NUMBER

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Waslora ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: out/Waslora-v*.apk
