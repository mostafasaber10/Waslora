services:
  waslora-resolver:
    build: .
    ports:
      - "8787:8787"
    environment:
      WASLORA_RESOLVER_TOKEN: ${WASLORA_RESOLVER_TOKEN:?Set WASLORA_RESOLVER_TOKEN in the environment}
      WASLORA_MAX_JOBS: ${WASLORA_MAX_JOBS:-2}
      WASLORA_MAX_DURATION_SECONDS: ${WASLORA_MAX_DURATION_SECONDS:-7200}
      WASLORA_MAX_FILE_BYTES: ${WASLORA_MAX_FILE_BYTES:-2147483648}
    volumes:
      - waslora_jobs:/var/lib/waslora/jobs
    restart: unless-stopped

volumes:
  waslora_jobs:
